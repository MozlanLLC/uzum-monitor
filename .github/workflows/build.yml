name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'            # копия web/ встроена в APK и в расширение — пересобираем, чтобы она не устаревала
      - 'extension/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Действия закреплены по хешу коммита: в сборке участвует ключ подписи,
# поэтому чужой код не должен меняться без нашего ведома. Рядом указан тег, которому соответствует хеш.

# По умолчанию — никаких прав; каждая задача получает только то, что ей нужно.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Не заданы секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk uzum-monitor.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uzum-monitor-apk
          path: uzum-monitor.apk
          if-no-files-found: error

      - name: Build browser extension
        run: |
          node extension/test.mjs
          node extension/build.mjs "1.0.${{ github.run_number }}"
          (cd extension/dist && zip -q -r ../../uzum-monitor-extension.zip .)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uzum-monitor-extension
          path: uzum-monitor-extension.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только для создания релиза
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uzum-monitor-apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uzum-monitor-extension

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" uzum-monitor.apk uzum-monitor-extension.zip \
            --target "${{ github.sha }}" \
            --title "Uzum Монитор 1.0.${{ github.run_number }}" \
            --notes "Android: uzum-monitor.apk. Расширение для браузера: uzum-monitor-extension.zip (установка описана в README)." \
            --latest
