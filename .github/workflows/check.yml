name: Check pull request

# Проверочная сборка без подписи и без секретов: ошибка в коде видна до слияния.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check web scripts
        run: |
          node -e "
            const fs=require('fs');
            const m=fs.readFileSync('web/ui.html','utf8').match(/<script>([\\s\\S]*)<\\/script>/);
            if(!m) throw new Error('В ui.html не найден скрипт');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/ui.js',m[1]);
            const man=JSON.parse(fs.readFileSync('web/manifest.json','utf8'));
            if(!Number.isInteger(man.version)) throw new Error('manifest.json: version должен быть целым числом');
            for(const f of man.files) fs.accessSync('web/'+f);
          "
          node --check "$RUNNER_TEMP/ui.js"
          node --check web/extract.js

      - name: Check browser extension
        run: |
          node extension/test.mjs
          node extension/build.mjs
          for f in extension/dist/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/dist/manifest.json','utf8'))"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Build (unsigned)
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
