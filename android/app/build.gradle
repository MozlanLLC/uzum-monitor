plugins {
    id 'com.android.application'
}

// Адрес репозитория задан жёстко: сборка из форка не должна менять источник обновлений.
// Тот же адрес проверяется в Updater.java.
def repo = 'MozlanLLC/uzum-monitor'
// Ключ подписи в репозитории не хранится: в GitHub Actions он приходит из секретов.
def keystoreFile = System.getenv('KEYSTORE_FILE')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def signed = keystoreFile && keystorePassword
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def webAssets = layout.buildDirectory.dir('webassets')

android {
    namespace 'uz.pricewatch.monitor'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.pricewatch.monitor'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        // Откуда приложение берёт обновления интерфейса и логики (папка web/ репозитория)
        buildConfigField 'String', 'UPDATE_BASE', "\"https://raw.githubusercontent.com/${repo}/main/web/\""
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (signed) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'app'
                keyPassword keystorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Без секретов получится неподписанный APK (для локальной проверки сборки)
            if (signed) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs += [webAssets.get().asFile]
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Копия папки web/ кладётся внутрь APK — приложение работает и до первого обновления
tasks.register('copyWeb', Copy) {
    from rootProject.file('../web')
    into webAssets.map { it.dir('web') }
}
tasks.named('preBuild') { dependsOn 'copyWeb' }
