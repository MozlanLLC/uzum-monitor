<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>Uzum Монитор цен</title>
<style>
:root{--bg:#f4f3f7;--card:#fff;--ink:#1f2026;--mute:#5f6270;--line:#e6e5ec;--acc:#7000ff;--acc-ink:#fff;
--good:#076b39;--good-bg:#e3f6ec;--bad:#b3261e;--bad-bg:#fdeaea;--warn:#7a4f00;--warn-bg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#131318;--card:#1d1d25;--ink:#ecebf2;--mute:#a3a5b3;--line:#2e2e3a;
--acc:#a06bff;--good:#4cd08a;--good-bg:#12331f;--bad:#ff8a80;--bad-bg:#3a1717;--warn:#f0c060;--warn-bg:#3a2e10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
h1{margin:0;font-size:22px;font-weight:700;flex:1;letter-spacing:-.01em}
.login{height:44px;border-radius:12px;border:0;background:var(--acc);color:var(--acc-ink);font-size:14px;font-weight:600;padding:0 14px;display:flex;align-items:center;gap:8px;max-width:58vw;flex:none}
.login svg{flex:none}
.login span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login.in{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:66px;z-index:6;display:flex;gap:8px;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line)}
.bar .primary{flex:1}
.bar .primary:disabled{opacity:.5}
.bar .ghost{height:48px;border-radius:12px;flex:none}
main{padding:0 14px 170px}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin-bottom:10px;min-height:36px}
.status span{flex:1}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;min-height:36px}
.ghost:disabled{opacity:.5}
.primary{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:0 18px;height:48px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;padding:0 14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.top{display:flex;gap:12px}
.pic{width:64px;height:86px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.info{flex:1;min-width:0}
.nrow{display:flex;align-items:flex-start;gap:2px}
.name{flex:1;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{width:44px;height:44px;margin:-10px -10px -8px 0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.prow{display:flex;align-items:center;gap:8px;margin-top:6px}
.pcol{flex:1;min-width:0}
.price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.oldl{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.cardp{font-size:12.5px;color:var(--acc);font-weight:600}
.spark{width:84px;height:36px;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.when{font-size:12px;color:var(--mute)}
.err{margin-top:8px;font-size:12.5px;color:var(--bad)}
.warnline{margin-top:8px;font-size:12.5px;color:var(--warn)}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.hist svg{width:100%;height:150px;display:block}
.axis{fill:var(--mute);font-size:11px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.ev{white-space:normal;min-width:150px}
th{color:var(--mute);font-weight:500}
td.n{font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:48px 16px;font-size:14px}
.note{color:var(--mute);font-size:13px;margin:0 0 10px}
.feed{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed:last-child{border-bottom:0}
.feed img,.feed .ph{width:40px;height:54px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
.feed .ft{flex:1;min-width:0;font-size:13px}
.feed .ft b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ft small{color:var(--mute)}
.feed input{width:22px;height:22px;flex:none;align-self:center}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--mute);font-size:12px}
.setrow input{width:22px;height:22px}
.ok{color:var(--good);font-weight:600;font-size:13px;white-space:nowrap}
h2{font-size:15px;margin:0 0 6px}
textarea{width:100%;height:120px;font:11px/1.3 monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;margin-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ver{color:var(--mute);font-size:12px;text-align:center;margin-top:14px}
.fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:28px;border:0;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(112,0,255,.35);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:6px;z-index:6}
nav button{flex:1;height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:11px;font-weight:500;position:relative;padding:0}
nav button.on{color:var(--acc);font-weight:600}
nav .badge[hidden]{display:none}
nav .badge{position:absolute;top:5px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px}
.sheet h2{font-size:17px;margin-bottom:10px}
.sheet input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.sheet input[type=text]:focus{outline:2px solid var(--acc);outline-offset:1px}
.msg{min-height:18px;font-size:13px;color:var(--bad);margin:6px 0}
.item{display:flex;align-items:center;width:100%;min-height:50px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:15px;padding:0 2px}
.item:last-child{border-bottom:0}
.item.danger{color:var(--bad)}
a.item{color:var(--acc);text-decoration:none}
.var{font-size:13px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input,.tools select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font:inherit;font-size:14px;min-width:0}
.tools input{flex:1}
.tools select{flex:none;max-width:48%}
.tools input:focus,.tools select:focus{outline:2px solid var(--acc);outline-offset:1px}
.newver{border-color:var(--acc)}
html.ext{scrollbar-width:thin}
html.popup{width:400px;height:600px;overflow-x:hidden}
html.popup body{overflow-x:hidden}
html.tab body{max-width:480px;margin:0 auto}
html.tab nav,html.tab .bar{left:50%;right:auto;width:480px;max-width:100%;transform:translateX(-50%)}
html.tab .fab{right:max(16px,calc(50% - 224px))}
html.tab .scrim{justify-content:center}
html.tab .sheet{max-width:480px}
.newver a{color:var(--acc);font-weight:600}
</style></head><body>
<header><h1 id="title">Товары</h1>
<button class="login" id="login" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg><span id="logintext">Войти в Uzum</span></button></header>
<main id="view"></main>
<button class="fab" id="fab" type="button" aria-label="Добавить товар"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<nav id="nav">
<button type="button" data-tab="products"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Товары</button>
<button type="button" data-tab="changes"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Изменения<span class="badge" id="badge" hidden></span></button>
<button type="button" data-tab="favorites"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Избранное</button>
<button type="button" data-tab="settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>Настройки</button>
</nav>
<div class="scrim" id="addsheet" hidden><div class="sheet"><h2>Добавить товар</h2>
<form id="f"><input id="u" type="text" placeholder="Ссылка на товар uzum.uz" autocomplete="off" aria-label="Ссылка на товар">
<div class="msg" id="msg"></div>
<div class="acts"><button class="primary" type="submit">Добавить</button><button class="ghost" type="button" id="addclose">Отмена</button></div></form>
<p class="note" id="addhint" style="margin-top:12px">Ещё можно нажать «Поделиться» на странице товара и выбрать «Uzum Монитор» или отметить товары во вкладке «Избранное».</p></div></div>
<div class="scrim" id="menu" hidden><div class="sheet" id="menubody"></div></div>
<script>
const $=s=>document.querySelector(s);
// Вне приложения (обычный браузер) подставляются пустые данные, чтобы страницу можно было открыть для просмотра.
const A=window.Android||{getState:()=>JSON.stringify({products:[],busy:false,pending:[],next_run:0,now:Math.floor(Date.now()/1000),info:{}}),
  getHistory:()=>'{"checks":[]}',addProduct:()=>'{"error":"Доступно только в приложении"}',deleteProduct(){},check(){},setPref(){},openSettings(){}};
const call=(m,...a)=>{ try{ const r=A[m](...a); return typeof r==='string'&&r?JSON.parse(r):r; }catch(e){ return {error:String(e)}; } };
const CAN=!!(window.Android&&typeof Android.runOnPage==='function');
const WISHES='https://uzum.uz/ru/wishes';
const APK='https://github.com/MozlanLLC/uzum-monitor/releases/latest/download/uzum-monitor.apk';
const money=n=>n==null?'—':String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' сум';
const num=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const dt=t=>t?new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const hm=t=>new Date(t*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const when=t=>{ if(!t) return '—'; const d=new Date(t*1000), n=new Date(); return d.toDateString()===n.toDateString()?'в '+hm(t):dt(t); };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }};
// Номер сборки приложения, начиная с которой работают все функции интерфейса.
// Увеличивается только когда меняется код в android/ и без нового APK что-то не заработает.
const NEED_APP=5;
const HAS=m=>!!(window.Android&&typeof Android[m]==='function');
// Тот же интерфейс работает в расширении для браузера: там window.Android подставляет extension/src/shim.js
const EXT=!!(window.Android&&Android.platform==='ext');
const go=u=>{ if(HAS('openUrl')) Android.openUrl(u); else location.href=u; };
const appBuild=()=>{ const m=String((S&&S.info&&S.info.app)||'').match(/(\d+)$/); return m?Number(m[1]):0; };
const outdated=()=>!!window.Android&&!EXT&&appBuild()>0&&appBuild()<NEED_APP;
const SORTS={new:'Сначала новые',changed:'Недавно менялись',drop:'Сильнее подешевели',price:'Сначала дешёвые',name:'По названию'};
let sort=store.get('sort','new'), query='', targetEdit=false; if(!SORTS[sort]) sort='new';
const TITLES={products:'Товары',changes:'Изменения',favorites:'Избранное',settings:'Настройки'};
let tab='products', filter='all', open={}, hist={}, onlyChanges={}, lastKey='', S=null;
let fav=null, favMsg='', favSel={}, diag='', waiters={}, menuId=null, menuSure=false;
let seenTs=Number(store.get('seenTs',0));
// Аккаунт Uzum: state 'in' — вход выполнен (приложение прочитало ваше избранное), '' — не выполнен или неизвестно
let acct={state:''}, loginOpened=false, acctMenu=false, outBusy=false;
const CANOUT=!!(window.Android&&typeof Android.logoutUzum==='function');
try{ acct=Object.assign(acct,JSON.parse(store.get('acct','{}'))); }catch(e){}

window.onPageResult=(token,result)=>{ const w=waiters[token]; delete waiters[token]; if(w) w(result); };
function runOnPage(url,fn,cb){ if(HAS('runFn')){ Android.runFn(url,fn,cb); return; }
  const t='t'+Date.now()+Math.random(); waiters[t]=cb; Android.runOnPage(url,'('+fn.toString()+')()',t); }
function setAcct(state){ acct={state}; store.set('acct',JSON.stringify(acct)); }
// Выполняется на странице uzum.uz при выходе: стирает данные сайта, сохранённые в приложении
function wipeScript(){
  const W=window; W.__t0=W.__t0||Date.now(); if((Date.now()-W.__t0)/1000<2) return null;
  try{ localStorage.clear(); }catch(e){} try{ sessionStorage.clear(); }catch(e){}
  return 'ok';
}
function favScript(){
  const W=window; W.__t0=W.__t0||Date.now(); const el=(Date.now()-W.__t0)/1000;
  if(document.readyState!=='complete'&&el<12) return null;
  const txt=e=>e?(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim():'';
  const cards=[...document.querySelectorAll('[data-test-id="product-card--default"]')].filter(c=>!c.closest('[data-test-id="block__offer"]'));
  const empty=!!document.querySelector('[data-test-id="block__empty-page"]');
  if(!cards.length&&!empty&&el<12) return null;
  if(cards.length){ window.scrollTo(0,document.documentElement.scrollHeight);
    if(W.__n!==cards.length){ W.__n=cards.length; W.__s=0; if(el<28) return null; }
    else if(++W.__s<3&&el<28) return null; }
  const seen={}, items=[];
  for(const c of cards){ const a=c.matches('a')?c:c.querySelector('a[href*="/product/"]'); if(!a) continue;
    const url=new URL(a.getAttribute('href'),location.origin).href; if(seen[url]) continue; seen[url]=1;
    const img=c.querySelector('img');
    items.push({url, title:txt(c.querySelector('[data-test-id="product-card__title"]')), price:txt(c.querySelector('[data-test-id="product-card__actual-price"]')), image:img?(img.getAttribute('src')||''):''}); }
  return JSON.stringify({items, empty});
}
function diagScript(){
  const W=window; W.__t0=W.__t0||Date.now(); const el=(Date.now()-W.__t0)/1000;
  const pe=document.querySelector('[data-test-id="text__product-price"]');
  if(!pe&&el<15) return null; if(el<5) return null;
  const clean=e=>e?e.outerHTML.replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/ data-v-[a-z0-9]+=""/g,'').replace(/ style="[^"]*"/g,''):'';
  const out={title:document.title, w:innerWidth, ids:[...new Set([...document.querySelectorAll('[data-test-id]')].map(e=>e.getAttribute('data-test-id')).filter(s=>!/^product-card/.test(s)))].join(' ')};
  let box=pe; for(let i=0;i<3&&box&&box.parentElement;i++) box=box.parentElement;
  out.priceBlock=clean(box).slice(0,3500);
  out.card=[...document.querySelectorAll('span,div,p')].filter(e=>e.children.length<=2&&/с картой|без карты|karta/i.test(e.textContent||'')&&(e.textContent||'').length<60&&!e.closest('[data-test-id^="product-card"]')).slice(0,3).map(e=>clean(e.parentElement&&e.parentElement.parentElement||e).slice(0,1500));
  return JSON.stringify(out);
}
function acctDiagScript(){
  const W=window; W.__t0=W.__t0||Date.now(); const el=(Date.now()-W.__t0)/1000;
  if(el<6||(document.readyState!=='complete'&&el<15)) return null;
  const txt=e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim().slice(0,30);
  const names=s=>(s||'').split(';').map(x=>x.split('=')[0].trim()).filter(Boolean);
  let ls=[]; try{ ls=Object.keys(localStorage); }catch(e){}
  return JSON.stringify({page:location.pathname, w:innerWidth,
    cards:document.querySelectorAll('[data-test-id="product-card--default"]').length,
    empty:!!document.querySelector('[data-test-id="block__empty-page"]'),
    cookies:names(document.cookie), storage:ls.slice(0,60),
    buttons:[...document.querySelectorAll('a[data-test-id],button[data-test-id],header [data-test-id],nav [data-test-id]')]
      .filter(e=>!e.closest('[data-test-id^="product-card"]')).slice(0,70).map(e=>e.getAttribute('data-test-id')+'='+txt(e))});
}
const pkey=u=>{ const m=u.match(/\/product\/(?:[^\/?#]*?-)?(\d+)\/?(?:[?#]|$)/), s=u.match(/[?&]skuId=(\d+)/); return m?m[1]+':'+(s?s[1]:'0'):u; };

function stepPath(pts,x,y){ let d='',prev=null; for(const p of pts){ d+=prev?` H${x(p.ts).toFixed(1)} V${y(p.price).toFixed(1)}`:`M${x(p.ts).toFixed(1)} ${y(p.price).toFixed(1)}`; prev=p; } return d; }
function spark(rows){
  const pts=(rows||[]).filter(r=>r.price!=null).slice(-48); if(!pts.length) return '';
  const W=84,H=36,P=4; let lo=Math.min(...pts.map(p=>p.price)), hi=Math.max(...pts.map(p=>p.price));
  const t0=pts[0].ts, t1=Math.max(pts[pts.length-1].ts,t0+1);
  const x=t=>P+(t-t0)/(t1-t0)*(W-2*P-10), y=p=>hi===lo?H/2:P+(hi-p)/(hi-lo)*(H-2*P);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="График цены" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${stepPath(pts,x,y)} H${W-P}"></path></svg>`;
}
function chart(rows){
  const pts=rows.filter(r=>r.price!=null); if(pts.length<1) return '';
  const W=700,H=150,L=74,R=10,T=10,B=22;
  let lo=Math.min(...pts.map(p=>p.price)), hi=Math.max(...pts.map(p=>p.price));
  if(lo===hi){lo=lo*0.97;hi=hi*1.03}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;

  if(acctMenu){ $('#menu').hidden=true; if(a==='uzum') login(); if(a==='logout') logout(); return; }
  const p=S.products.find(x=>x.id===menuId); if(!p) return;
  if(a==='del'&&!menuSure){ menuSure=true; drawMenu(); return; }
  if(a==='target'){ targetEdit=true; drawMenu(); return; }
  if(a==='tsave'){ const v=Number($('#tp').value.replace(/[^\d]/g,''));
    if(!v){ $('#tmsg').textContent='Введите цену числом, например 150 000.'; return; }
    call('setTarget',p.id,v); }
  if(a==='tclear') call('setTarget',p.id,0);
  if(a==='check') call('check',p.id);
  if(a==='hist') open[p.id]=!open[p.id];
  if(a==='site') go(p.url);
  if(a==='del') call('deleteProduct',p.id);
  $('#menu').hidden=true; setTimeout(()=>refresh(true),200); });
$('#f').addEventListener('submit',e=>{ e.preventDefault(); $('#msg').textContent='';
  const r=call('addProduct',$('#u').value); if(r&&r.error){ $('#msg').textContent=r.error; return; }
  $('#u').value=''; $('#addsheet').hidden=true; refresh(true); });
$('#view').addEventListener('click',e=>{
  const m=e.target.closest('[data-menu]'); if(m){ openMenu(Number(m.dataset.menu)); return; }
  const b=e.target.closest('button');
  if(b){
    if(b.id==='all'){ call('check',0); setTimeout(()=>refresh(true),300); }
    if(b.dataset.filter){ filter=b.dataset.filter; refresh(true); }
    if(b.id==='favload') loadFav();
    if(b.id==='favall'){ const have={}; S.products.forEach(p=>have[p.product_id+':'+(p.sku_id||0)]=1);
      const free=fav.map((f,i)=>have[pkey(f.url)]?-1:i).filter(i=>i>=0), all=free.every(i=>favSel[i]);
      favSel={}; if(!all) free.forEach(i=>favSel[i]=true); refresh(true); }
    if(b.id==='favadd'){ let n=0; Object.keys(favSel).forEach(i=>{ if(favSel[i]&&fav[i]){ const r=call('addProduct',fav[i].url); if(r&&!r.error) n++; } });
      favSel={}; favMsg=n?`Добавлено товаров: ${n}. Идёт первая проверка — смотрите вкладку «Товары».`:''; refresh(true); }
    if(b.dataset.s) call('openSettings',b.dataset.s);
    if(b.id==='login2') login();
    if(b.id==='logout2') openAcct();
    if(b.id==='astab') Android.openTab();
    if(b.id==='exp') Android.exportData();
    if(b.id==='imp') Android.importData();
    if(b.id==='diagb'){ diag='Собираю данные…'; refresh(true); runOnPage(S.products[0].url,diagScript,r=>{ const page=r||'Страница не ответила.';
      runOnPage(WISHES,acctDiagScript,w=>{ let ck=''; try{ if(HAS('uzumCookieNames')) ck=Android.uzumCookieNames(); }catch(e){}
        diag=page+'\n\n--- аккаунт: страница избранного ---\n'+(w||'Страница не ответила.')+'\n--- имена cookie (без значений) ---\n'+(ck||'нет данных')+'\n--- приложение ---\n'+JSON.stringify({app:S.info.app,web:S.info.web,acct:acct.state}); refresh(true); }); }); }
    if(b.id==='diagcopy'){ Android.copy(diag); b.textContent='Скопировано'; }
    if(b.id==='diagclose'){ diag=''; refresh(true); }
    return;
  }
  if(e.target.closest('.hist')||e.target.closest('a')) return;
  const o=e.target.closest('[data-open]'); if(o){ const id=o.dataset.open; open[id]=!open[id]; refresh(true); } });
$('#view').addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.only){ onlyChanges[t.dataset.only]=t.checked; refresh(true); }
  if(t.dataset.f){ favSel[t.dataset.f]=t.checked; refresh(true); }
  if(t.id==='tabmode'){ call('setPref','tab_mode',t.checked?'1':'0'); refresh(true); }
  if(t.id==='sort'){ sort=t.value; store.set('sort',sort); refresh(true); }
  if(t.id==='ns'){ call('setPref','notify_stock',t.checked?'1':'0'); refresh(true); } });
$('#view').addEventListener('input',e=>{ if(e.target.id==='q'){ query=e.target.value; refresh(true); } });
refresh(true); setInterval(refresh,3000);
</script></body></html>
